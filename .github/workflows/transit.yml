name: transit data

# Every night, fetch the agency's GTFS, reduce it to what the face needs, and
# commit the result if it changed. The per-stop files serve from GitHub Pages
# (docs/), and the hub file ships inside the app on the next release.

on:
  schedule:
    - cron: '17 9 * * *'   # 03:17 Mountain, after the agency's overnight update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch CVTD GTFS
        run: curl -fsSL -o /tmp/cvtd.zip https://mycvtdbus.org/gtfs
      - name: Reduce
        run: |
          python3 tools/transit.py /tmp/cvtd.zip --hub 41.7406,-111.8309 --routes G,B --data-url https://sybenx.github.io/headway/data/cvtd/ \
            --agency CVTD --name TRANSIT --hints tools/hints/cvtd.json --stops-out docs/data/cvtd
      - name: Commit if changed
        run: |
          git config user.name 'transit data'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data src/pkjs/transit.json
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "Transit data: $(date -u +%Y-%m-%d)"
          git push
